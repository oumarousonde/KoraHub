<!-- KORAHUB PREMIUM DESIGN SYSTEM v2 -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style id="kh-premium-design">
/* ══ PREMIUM VARIABLES ══ */
:root {
  /* Colors - deeper and more premium */
  --violet:        #1E0F4E;
  --violet-mid:    #3D2488;
  --violet-light:  #5E35B1;
  --violet-pale:   #EDE7F6;
  --gold:          #F0B429;
  --gold-light:    #FCEA2B;
  --gold-pale:     #FFF8E1;
  --gold-deep:     #C8900A;
  --white:         #FFFFFF;
  --off-white:     #F7F5FF;
  --bg-subtle:     #FAFAFA;
  --text-dark:     #120A2E;
  --text-body:     #2D1F5E;
  --text-muted:    #6B5B95;
  --text-light:    #9E8FBF;
  --border:        rgba(94,53,177,0.10);
  --border-gold:   rgba(240,180,41,0.25);
  --success:       #00C48C;
  --danger:        #FF4D6D;
  --warning:       #FF9F1C;
  --info:          #4361EE;

  /* Shadows - more elegant */
  --shadow-xs:   0 1px 3px rgba(30,15,78,0.08);
  --shadow-sm:   0 2px 8px rgba(30,15,78,0.10);
  --shadow-md:   0 4px 20px rgba(30,15,78,0.12);
  --shadow-lg:   0 8px 40px rgba(30,15,78,0.15);
  --shadow-xl:   0 16px 60px rgba(30,15,78,0.18);
  --shadow-gold: 0 4px 20px rgba(240,180,41,0.30);
  --shadow-card: 0 2px 12px rgba(30,15,78,0.08), 0 0 0 1px rgba(94,53,177,0.06);

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Border radius */
  --radius-sm:  8px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --radius-xl:  20px;
  --radius-2xl: 28px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: 'Manrope', 'Inter', system-ui, sans-serif;
  --font-display: 'Manrope', sans-serif;

  /* Transitions */
  --transition-fast: 150ms cubic-bezier(0.4,0,0.2,1);
  --transition-base: 250ms cubic-bezier(0.4,0,0.2,1);
  --transition-slow: 400ms cubic-bezier(0.4,0,0.2,1);
}

/* ══ GLOBAL RESET & BASE ══ */
*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: var(--font-sans) !important;
  color: var(--text-dark);
  background: var(--off-white);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.6;
}

/* ══ TYPOGRAPHY SCALE ══ */
h1, h2, h3, h4, h5, h6,
.section-title, .hero-title, .card-title,
.modal-title, .page-title, .dash-title,
[class*="title"], [class*="heading"] {
  font-family: var(--font-display) !important;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--text-dark);
}

p, span, div, a, li, td, th, label, input, select, textarea, button {
  font-family: var(--font-sans) !important;
}

/* ══ PREMIUM BUTTONS ══ */
.btn, button.btn {
  font-family: var(--font-sans) !important;
  font-weight: 600 !important;
  letter-spacing: -0.01em;
  border-radius: var(--radius-md) !important;
  transition: all var(--transition-base) !important;
  position: relative;
  overflow: hidden;
}

.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background var(--transition-fast);
}

.btn:hover::after { background: rgba(255,255,255,0.08); }
.btn:active { transform: scale(0.98) !important; }

.btn-gold, [class*="btn-gold"] {
  background: linear-gradient(135deg, #F0B429, #FCEA2B) !important;
  color: var(--violet) !important;
  font-weight: 700 !important;
  box-shadow: 0 2px 8px rgba(240,180,41,0.30) !important;
}

.btn-gold:hover {
  transform: translateY(-2px) !important;
  box-shadow: 0 6px 20px rgba(240,180,41,0.40) !important;
}

.btn-violet, [class*="btn-violet"] {
  background: linear-gradient(135deg, var(--violet-mid), var(--violet-light)) !important;
  color: white !important;
  box-shadow: 0 2px 8px rgba(30,15,78,0.25) !important;
}

.btn-violet:hover {
  transform: translateY(-2px) !important;
  box-shadow: 0 6px 20px rgba(30,15,78,0.30) !important;
}

/* ══ PREMIUM CARDS ══ */
.card, .product-card, .template-card, .book-card,
[class*="-card"]:not([class*="card-header"]):not([class*="card-body"]):not([class*="card-footer"]):not([class*="card-title"]) {
  border-radius: var(--radius-xl) !important;
  border: 1px solid var(--border) !important;
  box-shadow: var(--shadow-card) !important;
  transition: all var(--transition-base) !important;
  background: white !important;
}

.card:hover, .product-card:hover, .template-card:hover, .book-card:hover {
  transform: translateY(-4px) !important;
  box-shadow: var(--shadow-lg) !important;
  border-color: rgba(94,53,177,0.15) !important;
}

/* ══ PREMIUM INPUTS ══ */
input, select, textarea,
.form-input, .form-select, .form-textarea {
  font-family: var(--font-sans) !important;
  border-radius: var(--radius-md) !important;
  border: 1.5px solid var(--border) !important;
  transition: all var(--transition-fast) !important;
  font-size: 14px !important;
}

input:focus, select:focus, textarea:focus,
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none !important;
  border-color: var(--violet-light) !important;
  box-shadow: 0 0 0 3px rgba(94,53,177,0.08) !important;
}

/* ══ PREMIUM NAV ══ */
nav {
  background: rgba(30,15,78,0.97) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border-bottom: 1px solid rgba(240,180,41,0.12) !important;
}

/* ══ PREMIUM BADGES ══ */
.badge, [class*="badge"], [class*="tbadge"] {
  font-family: var(--font-sans) !important;
  font-weight: 700 !important;
  letter-spacing: 0.02em !important;
  border-radius: var(--radius-full) !important;
}

/* ══ PREMIUM SCROLLBAR ══ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(94,53,177,0.2); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(94,53,177,0.4); }

/* ══ PREMIUM SELECTION ══ */
::selection { background: rgba(94,53,177,0.15); color: var(--text-dark); }

/* ══ SKELETON LOADING ══ */
.skeleton {
  background: linear-gradient(90deg, #f0eeff 25%, #e8e4ff 50%, #f0eeff 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.5s infinite;
  border-radius: var(--radius-md);
}

@keyframes skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ══ MICRO ANIMATIONS ══ */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes pulse-ring {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* ══ HOVER EFFECTS ══ */
.hover-lift {
  transition: transform var(--transition-base), box-shadow var(--transition-base) !important;
}
.hover-lift:hover {
  transform: translateY(-4px) !important;
  box-shadow: var(--shadow-lg) !important;
}

.hover-scale {
  transition: transform var(--transition-fast) !important;
}
.hover-scale:hover { transform: scale(1.03) !important; }

/* ══ MOBILE PREMIUM ══ */
@media (max-width: 768px) {
  body { font-size: 15px; }

  .btn {
    padding: 11px 18px !important;
    font-size: 14px !important;
    min-height: 44px;
  }

  input, select, textarea {
    font-size: 16px !important; /* Prevents zoom on iOS */
    min-height: 44px;
  }

  .card, [class*="-card"] {
    border-radius: var(--radius-lg) !important;
  }
}

/* ══ PREMIUM FOOTER ══ */
footer {
  background: var(--violet) !important;
  border-top: 1px solid rgba(240,180,41,0.1) !important;
}

/* ══ PREMIUM TOAST ══ */
.toast {
  font-family: var(--font-sans) !important;
  font-weight: 500 !important;
  border-radius: var(--radius-lg) !important;
  box-shadow: var(--shadow-xl) !important;
}

/* ══ SECTION LABELS ══ */
.section-label {
  font-family: var(--font-sans) !important;
  font-weight: 700 !important;
  letter-spacing: 0.08em !important;
  text-transform: uppercase !important;
  font-size: 11px !important;
  color: var(--violet-light) !important;
}

/* ══ PREMIUM DIVIDERS ══ */
hr, .divider {
  border: none !important;
  border-top: 1px solid var(--border) !important;
}
</style>

<style>
:root{--violet:#2D1B69;--violet-mid:#4A2E9E;--violet-light:#6B46C1;--gold:#F5C518;--gold-light:#FFD95A;--off-white:#F8F6FF;--text-dark:#1A0F3C;--text-muted:#7C6FAD;--border:rgba(107,70,193,0.12);--shadow:0 8px 32px rgba(45,27,105,0.12);--success:#2ed573}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--off-white);color:var(--text-dark)}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:64px;background:rgba(45,27,105,0.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(245,197,24,0.12)}
.nav-logo{display:flex;align-items:center;text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--violet)}
.btn-ghost{background:transparent;color:white;border:1px solid rgba(255,255,255,0.25)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

.profile-hero{background:linear-gradient(135deg,var(--violet),#1A0F3C);padding:48px 5% 36px;position:relative;overflow:hidden}
.profile-hero::before{content:'';position:absolute;top:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(245,197,24,0.08),transparent)}
.profile-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.vendor-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:32px;color:var(--violet);flex-shrink:0;border:3px solid rgba(255,255,255,0.2)}
.vendor-info{flex:1}
.vendor-name{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:white;margin-bottom:4px}
.vendor-bio{font-size:14px;color:rgba(255,255,255,0.65);margin-bottom:10px}
.vendor-badges{display:flex;gap:8px;flex-wrap:wrap}
.vendor-badge{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:100px;padding:3px 12px;font-size:11px;font-weight:600;color:rgba(255,255,255,0.8)}
.vendor-stats{display:flex;gap:24px;flex-wrap:wrap}
.vendor-stat{text-align:center}
.vendor-stat-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--gold)}
.vendor-stat-label{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px}

.main{max-width:1100px;margin:0 auto;padding:36px 5%}
.section-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--text-dark);margin-bottom:20px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.product-card{background:white;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .25s}
.product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.product-thumb{height:160px;display:flex;align-items:center;justify-content:center;font-size:44px}
.product-body{padding:12px}
.product-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text-dark);margin-bottom:8px}
.product-footer{display:flex;align-items:center;justify-content:space-between}
.product-price{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--violet)}

footer{background:var(--violet);padding:24px 5%;margin-top:40px}
.footer-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.footer-copy{font-size:13px;color:rgba(255,255,255,0.5)}
.footer-links{display:flex;gap:14px}
.footer-links a{font-size:13px;color:rgba(255,255,255,0.6);text-decoration:none}
.footer-links a:hover{color:var(--gold)}
.toast{position:fixed;bottom:24px;right:24px;z-index:2000;background:var(--violet);border:1px solid var(--gold);color:white;padding:13px 18px;border-radius:11px;font-size:13px;display:flex;align-items:center;gap:9px;transform:translateX(120%);transition:transform .3s;box-shadow:var(--shadow)}
.toast.show{transform:translateX(0)}

<style id="kh-premium-cards">
/* ══ PREMIUM PRODUCT CARDS ══ */
.prod-card, .product-card, .template-card, .book-card {
  background: white !important;
  border: 1px solid rgba(94,53,177,0.10) !important;
  border-radius: 20px !important;
  overflow: hidden !important;
  cursor: pointer !important;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1) !important;
  box-shadow: 0 2px 12px rgba(30,15,78,0.08), 0 0 0 1px rgba(94,53,177,0.06) !important;
  position: relative !important;
}

.prod-card:hover, .product-card:hover, .template-card:hover, .book-card:hover {
  transform: translateY(-6px) !important;
  box-shadow: 0 16px 48px rgba(30,15,78,0.16) !important;
  border-color: rgba(94,53,177,0.18) !important;
}

/* Thumb zoom on hover */
.prod-card:hover .prod-thumb,
.product-card:hover .product-thumb {
  transform: scale(1.04);
}

.prod-thumb, .product-thumb, .template-thumb, .book-cover-main {
  transition: transform 0.5s ease !important;
}

/* Premium badge styles */
.prod-badge, .tbadge, .badge-age, .badge-lang, .badge-new, .badge-free {
  font-size: 9px !important;
  font-weight: 800 !important;
  padding: 3px 8px !important;
  border-radius: 100px !important;
  letter-spacing: 0.03em !important;
}

/* Wishlist button - show on hover */
.prod-wishlist, .template-wishlist, .wishlist-btn {
  opacity: 0 !important;
  transition: all 0.2s ease !important;
}
.prod-card:hover .prod-wishlist,
.template-card:hover .template-wishlist,
.book-card:hover .wishlist-btn {
  opacity: 1 !important;
}

/* Type badge at bottom */
.prod-type-badge {
  backdrop-filter: blur(8px) !important;
  -webkit-backdrop-filter: blur(8px) !important;
}

/* Rating stars */
.prod-stars { letter-spacing: 1px !important; }

/* Price */
.prod-price, .template-price, .book-price, .coloring-price {
  font-weight: 900 !important;
  letter-spacing: -0.02em !important;
}

/* Buy button */
.prod-buy, .buy-btn {
  border-radius: 10px !important;
  font-weight: 700 !important;
  transition: all 0.15s ease !important;
}
.prod-buy:hover, .buy-btn:hover {
  transform: scale(1.05) !important;
  filter: brightness(1.1) !important;
}

/* Vendor info */
.prod-vendor {
  display: flex !important;
  align-items: center !important;
  gap: 5px !important;
  font-size: 11px !important;
  color: var(--text-muted) !important;
}

/* Product name line clamp */
.prod-name, .template-name, .book-name {
  display: -webkit-box !important;
  -webkit-line-clamp: 2 !important;
  -webkit-box-orient: vertical !important;
  overflow: hidden !important;
  line-height: 1.4 !important;
}

/* Card footer border */
.prod-footer {
  padding-top: 10px !important;
  border-top: 1px solid rgba(94,53,177,0.08) !important;
  margin-top: 10px !important;
}

/* Skeleton loading for cards */
.prod-card.loading .prod-thumb {
  background: linear-gradient(90deg, #f0eeff 25%, #e8e4ff 50%, #f0eeff 75%) !important;
  background-size: 200% 100% !important;
  animation: skeleton-shimmer 1.5s infinite !important;
}
.prod-card.loading .prod-name,
.prod-card.loading .prod-vendor,
.prod-card.loading .prod-price {
  background: linear-gradient(90deg, #f0eeff 25%, #e8e4ff 50%, #f0eeff 75%) !important;
  background-size: 200% 100% !important;
  animation: skeleton-shimmer 1.5s infinite !important;
  border-radius: 6px !important;
  color: transparent !important;
}

/* Products grid responsive */
.products-row, .books-grid, .templates-grid, .coloring-grid {
  display: grid !important;
  gap: 18px !important;
}

@media (max-width: 480px) {
  .prod-card, .product-card, .template-card, .book-card {
    border-radius: 16px !important;
  }
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBUM1tOdkfEZA4z1ts6tyRhlcRqotHE4zs",
  authDomain: "korahub-7160.firebaseapp.com",
  projectId: "korahub-7160",
  storageBucket: "korahub-7160.firebasestorage.app",
  messagingSenderId: "334789190484",
  appId: "1:334789190484:web:90a21186adb353409f5ec1"
});
const db = getFirestore(app);

async function loadVendorProfile() {
  const urlParams = new URLSearchParams(window.location.search);
  const vendorId = urlParams.get('id');
  if (!vendorId) { document.getElementById('vendorName').textContent = 'Vendeur introuvable'; return; }

  try {
    // Load vendor info
    const vendorDoc = await getDoc(doc(db, 'users', vendorId));
    if (vendorDoc.exists()) {
      const v = vendorDoc.data();
      const initials = (v.firstName?.[0] || 'V') + (v.lastName?.[0] || '');
      document.getElementById('vendorAvatar').textContent = initials.toUpperCase();
      document.getElementById('vendorName').textContent = v.firstName + ' ' + v.lastName;
      document.getElementById('vendorCountry').textContent = '🌍 ' + (v.country || 'Afrique');
      document.title = v.firstName + ' ' + v.lastName + ' – KoraHub';
    }

    // Load vendor products
    const q = query(collection(db, 'products'), where('sellerId', '==', vendorId));
    const snapshot = await getDocs(q);
    const grid = document.getElementById('vendorProductsGrid');
    document.getElementById('vendorProductCount').textContent = snapshot.size;

    if (snapshot.empty) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">Ce vendeur n'a pas encore publié de produits.</div>';
      return;
    }

    grid.innerHTML = '';
    snapshot.forEach(d => {
      const p = { id: d.id, ...d.data() };
      const price = p.deliveryOptions?.[0]?.price || p.price || 0;
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="product-thumb" style="background:linear-gradient(135deg,#2D1B69,#6B46C1)">📦</div>
        <div class="product-body">
          <div class="product-name">${p.title || 'Produit'}</div>
          <div class="product-footer">
            <span class="product-price">${price.toLocaleString()} F</span>
            <button onclick="window.location.href='korahub-produit-panier.html?product=${p.id}&vendor=${vendorId}'" style="padding:6px 12px;border-radius:7px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#4A2E9E,#6B46C1);color:white">Voir</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  } catch(e) { console.error(e); }
}

loadVendorProfile();
</script>
<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
